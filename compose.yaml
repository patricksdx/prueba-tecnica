services:
  app:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Define VITE_CLERK_PUBLISHABLE_KEY en .env}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Define VITE_CLERK_PUBLISHABLE_KEY en .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Define CLERK_SECRET_KEY en .env}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env}
      CLERK_ADMIN_IDS: ${CLERK_ADMIN_IDS:-}
